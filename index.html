<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>品項登記</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f6f0ea;color:#222;-webkit-text-size-adjust:100%}
.hdr{background:linear-gradient(135deg,#b8713f,#8e2f26);color:#fff;padding:20px 16px;text-align:center}
.hdr h1{font-size:1.4rem;font-weight:600;letter-spacing:.5px}
.hdr p{font-size:.9rem;margin-top:5px;opacity:.8}
.card{background:#fff;margin:12px;border-radius:14px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.lbl{font-size:.8rem;color:#666;font-weight:600;margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px}
.card input{width:100%;padding:13px 14px;border:1.5px solid #ddd;border-radius:10px;font-size:1rem}
.card input:focus{outline:none;border-color:#d5641f}
.search-wrap{position:relative}
.search-wrap .clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:none;background:#eee;color:#777;width:26px;height:26px;border-radius:50%;font-size:1rem;cursor:pointer;display:none;line-height:1}
.search-wrap .clear.show{display:block}
.tabs{display:flex;overflow-x:auto;background:#fff;padding:4px 8px 0;border-bottom:1.5px solid #eee;gap:2px}
.tabs.dim .tab{opacity:.45}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:12px 16px;font-size:.9rem;color:#888;cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1.5px;white-space:nowrap;flex-shrink:0}
.tab.on{color:#d5641f;border-bottom-color:#d5641f;font-weight:600}
.tabs-wrap{position:relative}
.tabs-wrap::after{content:"";position:absolute;top:0;right:0;bottom:0;width:34px;pointer-events:none;background:linear-gradient(to right,rgba(255,255,255,0),#fff)}
.swipe-tip{font-size:.74rem;color:#9a9a9a;text-align:center;padding:7px 12px 0}
.tbl{margin:12px;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08)}
table{width:100%;border-collapse:collapse;table-layout:fixed}
col.c1{width:34%}col.c2{width:46%}col.c3{width:20%}
thead th{background:#d5641f;color:#fff;padding:11px 10px;font-size:.9rem;font-weight:500;text-align:left}
thead th:last-child{text-align:center}
tbody tr{border-bottom:1px solid #efe6df}
tbody tr:last-child{border-bottom:none}
tbody tr:nth-child(even){background:#faf6f2}
td{padding:12px 10px;vertical-align:top}
.iname{font-weight:600;color:#8a3d0f;font-size:1rem;line-height:1.3}
.icat{display:inline-block;color:#888;font-size:.72rem;margin-top:4px}
.idesc{color:#444;font-size:.88rem;margin-top:5px;line-height:1.6}
.itag{display:inline-block;background:#e3f0fb;color:#1b5e9e;font-size:.7rem;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:middle;font-weight:600;white-space:nowrap}
.tab.zone{color:#1b5e9e}
.tab.zone.on{color:#1b5e9e;border-bottom-color:#1b5e9e}
.inote{display:inline-block;background:#fff8e1;color:#9a6700;padding:3px 7px;border-radius:5px;margin-top:5px;font-size:.82rem;line-height:1.5}
.iprice{color:#c0392b;font-size:.88rem;margin-bottom:6px;font-weight:500}
.qty{width:100%;padding:10px 4px;text-align:center;border:1.5px solid #ccc;border-radius:8px;font-size:1.1rem}
.qty:focus{outline:none;border-color:#d5641f}
.qty.has{border-color:#d5641f;background:#fdebd9;font-weight:600}
.cart-bar{margin:0 12px 22px;font-size:.85rem;color:#d5641f;font-weight:600;min-height:1.2em}
.sub-wrap{padding:14px 12px 32px}
.sub{width:100%;padding:16px;background:#d5641f;color:#fff;border:none;border-radius:12px;font-size:1.1rem;font-weight:600;cursor:pointer;letter-spacing:.5px}
.sub:disabled{background:#aaa}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;align-items:flex-end}
.overlay.show{display:flex}
.sheet{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:40px 20px;text-align:center}
.clbtn{padding:14px;background:#efe6df;color:#555;border:none;border-radius:12px;font-size:.95rem;cursor:pointer;max-width:200px;width:100%;margin:0 auto;display:block}
.review-sheet{text-align:left;padding:18px 16px 24px;max-height:86vh;display:flex;flex-direction:column}
.review-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.review-head .t{font-size:1.1rem;font-weight:600;color:#8a3d0f}
.rv-close{border:none;background:#efe6df;color:#666;width:30px;height:30px;border-radius:50%;font-size:1rem;cursor:pointer}
.rv-name{font-size:.9rem;color:#666;margin-bottom:8px}
.rv-list{overflow-y:auto;flex:1}
.rv-item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #efe6df}
.rv-item .nm{flex:1;font-size:.95rem;color:#8a3d0f;font-weight:600;line-height:1.3}
.rv-item .pr{font-size:.76rem;color:#999;font-weight:400;margin-top:2px}
.rv-step{display:flex;align-items:center;gap:5px}
.rv-step button{width:30px;height:30px;border:1.5px solid #ccc;background:#fff;border-radius:8px;font-size:1.1rem;cursor:pointer;color:#d5641f;line-height:1;padding:0}
.rv-step .n{min-width:26px;text-align:center;font-size:1rem;font-weight:600}
.rv-amt{min-width:54px;text-align:right;font-size:.9rem;font-weight:600;color:#c0392b}
.rv-del{border:none;background:none;font-size:1.05rem;cursor:pointer;padding:4px 2px}
.rv-total{display:flex;justify-content:space-between;align-items:center;border-top:2px solid #8a3d0f;padding-top:12px;margin-top:6px;font-size:1.15rem;font-weight:700;color:#8a3d0f}
.rv-notice{background:#fff8e1;border:1px solid #f3d9a4;color:#7a4a12;border-radius:10px;padding:10px 12px;margin-top:12px;font-size:.86rem;line-height:1.7}
.rv-notice b{color:#d62828;font-weight:800}
.rv-actions{display:flex;gap:10px;margin-top:16px}
.rv-back{flex:1;padding:14px;background:#efe6df;color:#555;border:none;border-radius:12px;font-size:1rem;cursor:pointer}
.rv-submit{flex:1.4;padding:14px;background:#d5641f;color:#fff;border:none;border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer}
.rv-submit:disabled{background:#aaa}
.rv-empty{text-align:center;color:#aaa;padding:24px}
.empty{text-align:center;padding:32px;color:#aaa;font-size:1rem}
 
/* ── 楓葉飄落（純裝飾） ── */
.leaves{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.leaf{position:absolute;top:-8vh;font-size:22px;opacity:0;animation:leafFall linear infinite;will-change:transform}
.leaf>span{display:inline-block;animation:leafSway ease-in-out infinite alternate}
@keyframes leafFall{0%{transform:translate(0,0) rotate(0deg);opacity:0}6%{opacity:.88}92%{opacity:.88}100%{transform:translate(38vw,116vh) rotate(430deg);opacity:0}}
@keyframes leafSway{from{transform:translateX(-30px) rotate(-26deg)}to{transform:translateX(30px) rotate(22deg)}}
@keyframes flakeFall{0%{transform:translate(0,0);opacity:0}8%{opacity:.95}92%{opacity:.95}100%{transform:translate(30vw,116vh);opacity:0}}
.flake{position:absolute;top:-6vh;font-size:11px;opacity:0;animation:flakeFall linear infinite;will-change:transform}
.flake>span{display:inline-block;animation:leafSway ease-in-out infinite alternate}
.flake svg{width:1em;height:1em;display:block;filter:drop-shadow(0 0 3px rgba(255,255,255,.95)) drop-shadow(0 0 2px rgba(90,150,210,.55))}
.leaf:nth-child(1){left:2%;animation-duration:13s;animation-delay:0s;font-size:26px}.leaf:nth-child(1)>span{animation-duration:1.9s}
.leaf:nth-child(2){left:22%;animation-duration:16s;animation-delay:4s;font-size:22px}.leaf:nth-child(2)>span{animation-duration:2.3s}
.leaf:nth-child(3){left:44%;animation-duration:12s;animation-delay:8s;font-size:30px}.leaf:nth-child(3)>span{animation-duration:1.7s}
.leaf:nth-child(4){left:62%;animation-duration:15s;animation-delay:2s;font-size:24px}.leaf:nth-child(4)>span{animation-duration:2.5s}
.leaf:nth-child(5){left:50%;animation-duration:17s;animation-delay:10s;font-size:20px}.leaf:nth-child(5)>span{animation-duration:2.1s}
.leaf:nth-child(6){left:62%;animation-duration:13s;animation-delay:6s;font-size:28px}.leaf:nth-child(6)>span{animation-duration:2s}
.flake:nth-child(5){left:12%;animation-duration:23s;animation-delay:4s;font-size:11px}.flake:nth-child(5)>span{animation-duration:3.2s}
.flake:nth-child(6){left:62%;animation-duration:26s;animation-delay:14s;font-size:12px}.flake:nth-child(6)>span{animation-duration:3.6s}
.flake:nth-child(9){left:68%;animation-duration:22s;animation-delay:7s;font-size:13px}.flake:nth-child(9)>span{animation-duration:3s}
.leaf svg{width:1em;height:1.1em;display:block;filter:drop-shadow(0 1px 1px rgba(120,60,0,.18))}
.leaf:nth-child(3n+1) svg path{fill:url(#lf1)}
.leaf:nth-child(3n+2) svg path{fill:url(#lf2)}
.leaf:nth-child(3n) svg path{fill:url(#lf3)}
/* 風痕：固定在那一帶，從左到右畫出、捲兩圈、再從尾端消散；120 秒一陣 */
.wind{position:absolute;left:3vw;width:94vw;height:70px;pointer-events:none;opacity:0;animation:windFlow linear infinite}
.wind svg{width:100%;height:100%;display:block;overflow:visible}
.wind .wp{stroke-dasharray:1300;stroke-dashoffset:1300;animation:windDraw linear infinite}
@keyframes windFlow{0%{opacity:0}0.5%{opacity:.95}6.5%{opacity:.85}7%{opacity:0}100%{opacity:0}}
@keyframes windDraw{0%{stroke-dashoffset:1300}4%{stroke-dashoffset:0}7%{stroke-dashoffset:-1300}100%{stroke-dashoffset:-1300}}
.wind:nth-child(7){top:18vh;animation-duration:120s;animation-delay:3s}.wind:nth-child(7) .wp{animation-duration:120s;animation-delay:3s}
.wind:nth-child(8){top:56vh;animation-duration:120s;animation-delay:4.5s}.wind:nth-child(8) .wp{animation-duration:120s;animation-delay:4.5s}
/* 楓葉落在「送出訂單」按鈕上緣（當作地面），一片片躺著堆起來 */
.sub-wrap{position:relative}
.pile{position:absolute;left:14px;right:14px;top:14px;height:0;pointer-events:none;z-index:3;transition:opacity 1.6s}
.pile.fade{opacity:0}
.pile .pl{position:absolute;bottom:-2px;width:22px;height:24px;transition:transform .5s ease-out,bottom .5s ease-out}
.pile .pl svg{width:100%;height:100%;display:block;filter:drop-shadow(0 1px 1px rgba(80,40,10,.3))}
/* 風一來：楓葉與雪花停止下落，順著風往右被送出畫面 */
.leaf.hold,.flake.hold{animation-play-state:paused}
@keyframes sweptAway{0%{transform:translate(0,0) rotate(0deg);opacity:1}30%{transform:translate(30vw,-4vh) rotate(300deg);opacity:1}60%{transform:translate(62vw,2vh) rotate(640deg);opacity:1}100%{transform:translate(118vw,-3vh) rotate(1000deg);opacity:0}}
@keyframes sweptFlake{0%{transform:translate(0,0);opacity:1}40%{transform:translate(34vw,-3vh) rotate(180deg);opacity:1}100%{transform:translate(118vw,-2vh) rotate(480deg);opacity:0}}
.leaf>span.swept{animation:sweptAway 2.8s cubic-bezier(.25,.1,.55,1) forwards}
.flake>span.swept{animation:sweptFlake 2.6s cubic-bezier(.25,.1,.55,1) forwards}
@media (prefers-reduced-motion:reduce){.leaves{display:none}}

@media (max-width:640px){
  .tbl{margin:12px;background:transparent;box-shadow:none;border-radius:0;overflow:visible}
  table,tbody{display:block;width:100%}
  thead{display:none}
  tbody tr,tbody tr:nth-child(even){display:block;background:#fff;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:14px;margin-bottom:12px;border:none}
  td{display:block;padding:0;border:none}
  .iname{font-size:1.05rem;line-height:1.4}
  .idesc{font-size:.92rem;margin-top:8px}
  tr td:last-child{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding-top:12px;border-top:1px dashed #eee;text-align:left}
  tr td:last-child .iprice{margin:0;font-size:1.05rem;white-space:nowrap}
  .qty{width:120px;height:46px;font-size:1.2rem;padding:8px;flex-shrink:0}
  .empty{background:#fff;border-radius:14px}
}
</style>
</head>

<div class="hdr">
  <h1>🍁 品項登記</h1>
  <p id="period"></p>
</div>

<div class="card">
  <div class="lbl">LINE 名字 / 暱稱</div>
  <input type="text" id="nm" placeholder="例：小美 或 王小美" autocomplete="off">
</div>

<div class="card">
  <div class="lbl">搜尋品項</div>
  <div class="search-wrap">
    <input type="text" id="search" placeholder="🔍 輸入關鍵字，例如：護眼、膠囊、咳嗽…" autocomplete="off" oninput="onSearch(this.value)">
    <button type="button" class="clear" id="clearBtn" onclick="clearSearch()">✕</button>
  </div>
</div>

<div class="tabs-wrap">
  <div class="tabs" id="tabs"></div>
</div>
<div class="swipe-tip">👈 左右滑動切換分類 👉</div>

<div class="tbl">
  <table>
    <colgroup><col class="c1"><col class="c2"><col class="c3"></colgroup>
    <thead><tr><th>品項</th><th>說明</th><th style="text-align:center">數量</th></tr></thead>
    <tbody id="tb"><tr><td colspan="3" class="empty">載入中…</td></tr></tbody>
  </table>
</div>

<div class="cart-bar" id="cartBar"></div>

<div class="sub-wrap">
  <button class="sub" id="subbtn" onclick="go()">✅ 送出訂單</button>
</div>

<div class="overlay" id="review" onclick="reviewBg(event)">
  <div class="sheet review-sheet">
    <div class="review-head">
      <span class="t">🧾 確認訂單明細</span>
      <button class="rv-close" onclick="closeReview()" aria-label="返回">✕</button>
    </div>
    <div class="rv-name" id="rvName"></div>
    <div class="rv-list" id="rvList"></div>
    <div class="rv-total"><span>總計</span><span id="rvTotal">$0</span></div>
    <div class="rv-actions">
      <button class="rv-back" onclick="closeReview()">← 繼續選購</button>
      <button class="rv-submit" id="rvSubmit" onclick="confirmSubmit()">✅ 確認送出</button>
    </div>
  </div>
</div>

<div class="overlay" id="ov" onclick="bgClose(event)">
  <div class="sheet">
    <div style="font-size:48px;margin-bottom:16px">🍁</div>
    <div style="font-size:1.3rem;font-weight:600;color:#8a3d0f;margin-bottom:10px">訂單已送出！</div>
    <div style="font-size:.95rem;color:#666;line-height:1.8;margin-bottom:28px">
      感謝您<br>小幫手會盡快與您確認明細
    </div>
    <div class="rv-notice" style="text-align:left;margin:0 0 24px">所有品項皆於款項收齊後才會送單製作，<br>還請大家配合於 <b>[ 結單後三天內 ]</b> 完成匯款，<br>以利我們後續作業。<br>如有任何問題，歡迎隨時敲敲小幫手協助～<br>謝謝大家的配合！💛</div>
    <button class="clbtn" onclick="forceClose()">關閉</button>
  </div>
</div>

<script>
let all=[], curCat='', keyword='';
const qtyMap={};               
const HIDDEN=['儲備選手'];      

// ===== 後端接口（GitHub Pages 靜態版）=====
// 頁面本身不經過 Google 登入；只有拿品項與送訂單兩個動作會呼叫後端。
// 後端只開放 items（團名＋開團品項，無成本）與 order（送單）兩個動作。
const API = 'https://script.google.com/macros/s/AKfycbx4ZSuMNUrZXqy9TvLXHHFqrjj-i9uB5yEIppyPPHrkPAWeIUk441o-aVJF0sb8u9_-2Q/exec';

function apiGet(action){
  return fetch(API + '?action=' + encodeURIComponent(action), {method:'GET', redirect:'follow', cache:'no-store'})
    .then(r=>r.json());
}
function apiPost(payload){
  // 用 text/plain 送出，避免瀏覽器先發 preflight（Apps Script 不支援）
  return fetch(API, {method:'POST', redirect:'follow', body: JSON.stringify(payload)})
    .then(r=>r.json());
}

apiGet('items')
  .then(d=>{
    if(!d || !d.ok) throw new Error(d && d.error || 'bad response');
    document.getElementById('period').textContent = d.name;
    all=d.items; buildTabs(); render();
  })
  .catch(()=>{document.getElementById('tb').innerHTML='<tr><td colspan="3" class="empty">載入失敗，請重新整理頁面</td></tr>';});


const TAG_PREFIX='#tag:';
function tagParts(t){ const s=String(t||'').trim(); if(!s) return null; const [zone,badge]=s.split(/[\/／]/).map(x=>x.trim()); return {zone, badge: badge||zone}; }
function zoneList(){ const seen=[]; visibleItems().forEach(i=>{ const t=tagParts(i.tag); if(t && !seen.includes(t.zone)) seen.push(t.zone); }); return seen; }
function isZone(c){ return typeof c==='string' && c.startsWith(TAG_PREFIX); }

function visibleItems(){
  return all.filter(i=>!HIDDEN.includes(i.category));
}

function buildTabs(){
  const ORDER=['入冬專區','當月新品','當月特惠','熱門膠囊','眼睛專區','健腦益智','關節骨骼','感冒咳嗽(呼吸系統)','面部保養','零零嘴嘴','外用專區','婦科專區'];
  const rawCats=[...new Set(visibleItems().map(i=>i.category).filter(Boolean))];
  const zones=zoneList().map(z=>TAG_PREFIX+z);          // 有標籤的品項自動長出專區，排最前面
  const cats=[
    ...zones,
    ...ORDER.filter(c=>rawCats.includes(c)),
    ...rawCats.filter(c=>!ORDER.includes(c))
  ];
  if(!curCat || !cats.includes(curCat)) curCat = cats[0] || '';
  document.getElementById('tabs').innerHTML=
    cats.map(c=>`<div class="tab${isZone(c)?' zone':''}${c===curCat?' on':''}" onclick="sc(this,'${c}')">${isZone(c)?c.slice(TAG_PREFIX.length):c}</div>`).join('');
}

function sc(el,cat){
  clearSearch(true);               // 點分頁時清掉搜尋
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  el.classList.add('on'); curCat=cat; render();
}

function onSearch(v){
  keyword=v.trim();
  document.getElementById('clearBtn').classList.toggle('show', keyword.length>0);
  document.getElementById('tabs').classList.toggle('dim', keyword.length>0);
  render();
}

function clearSearch(skipRender){
  keyword='';
  document.getElementById('search').value='';
  document.getElementById('clearBtn').classList.remove('show');
  document.getElementById('tabs').classList.remove('dim');
  if(!skipRender) render();
}

function render(){
  const base=visibleItems();
  let list;
  if(keyword){
    const k=keyword.toLowerCase();
    list=base.filter(it=>
      (it.name||'').toLowerCase().includes(k) ||
      (it.desc||'').toLowerCase().includes(k) ||
      (it.note||'').toLowerCase().includes(k) ||
      (it.category||'').toLowerCase().includes(k) ||
      (it.tag||'').toLowerCase().includes(k)
    );
  }else{
    list=isZone(curCat)
      ? base.filter(i=>{ const t=tagParts(i.tag); return t && t.zone===curCat.slice(TAG_PREFIX.length); })
      : base.filter(i=>i.category===curCat);
  }

  if(!list.length){
    document.getElementById('tb').innerHTML='<tr><td colspan="3" class="empty">'+(keyword?('找不到符合「'+keyword+'」的品項'):'本分類暫無開團品項')+'</td></tr>';
    updateCart();
    return;
  }

  document.getElementById('tb').innerHTML=list.map(it=>{
    const q=qtyMap[it.name]||'';
    return `
    <tr>
      <td>
        <div class="iname">${it.name}${tagParts(it.tag)?`<span class="itag">${tagParts(it.tag).badge}</span>`:''}</div>
        ${(keyword||isZone(curCat))?`<div class="icat">${it.category||''}</div>`:''}
        ${it.note?`<div class="inote">⚠️ ${it.note}</div>`:''}
      </td>
      <td><div class="idesc">${(it.desc||'').replace(/\n/g,'<br>')}</div></td>
      <td style="text-align:center;vertical-align:middle">
        <div class="iprice">$${it.price}／${it.unit}</div>
        <input class="qty${q>0?' has':''}" type="number" min="0" placeholder="0"
          inputmode="numeric" data-name="${it.name}" value="${q}">
      </td>
    </tr>`;}).join('');
  updateCart();
}

// 數量輸入用事件委派，tbody 重繪也不會掉（值存在 qtyMap）
document.getElementById('tb').addEventListener('input', function(e){
  const el=e.target;
  if(!el.classList || !el.classList.contains('qty')) return;
  const name=el.dataset.name;
  const q=parseInt(el.value)||0;
  if(q>0) qtyMap[name]=q; else delete qtyMap[name];
  el.classList.toggle('has', q>0);
  updateCart();
});

function updateCart(){
  const names=Object.keys(qtyMap);
  let count=0; names.forEach(n=>count+=qtyMap[n]);
  document.getElementById('cartBar').textContent =
    names.length ? `🛒 已選 ${names.length} 項，共 ${count} 件` : '';
}


function go(){
  const name=document.getElementById('nm').value.trim();
  if(!name){alert('請填寫 LINE 名字或暱稱');return;}
  if(!Object.keys(qtyMap).length){alert('請至少選購一項商品');return;}
  openReview();
}

function infoOf(name){ return all.find(x=>x.name===name) || {price:0,unit:''}; }

function openReview(){
  document.getElementById('rvName').textContent='訂購人：'+document.getElementById('nm').value.trim();
  renderReview();
  document.getElementById('review').classList.add('show');
}

function renderReview(){
  const names=Object.keys(qtyMap);
  const listEl=document.getElementById('rvList');
  const submitBtn=document.getElementById('rvSubmit');
  if(!names.length){
    listEl.innerHTML='<div class="rv-empty">目前沒有任何品項<br>請按「繼續選購」加入商品</div>';
    document.getElementById('rvTotal').textContent='$0';
    submitBtn.disabled=true;
    return;
  }
  submitBtn.disabled=false;
  let total=0;
  listEl.innerHTML=names.map(n=>{
    const info=infoOf(n), q=qtyMap[n], amt=q*info.price; total+=amt;
    return '<div class="rv-item">'
      +'<div class="nm">'+n+'<div class="pr">$'+info.price+'／'+info.unit+'</div></div>'
      +'<div class="rv-step">'
        +'<button class="dec" data-name="'+n+'">−</button>'
        +'<span class="n">'+q+'</span>'
        +'<button class="inc" data-name="'+n+'">＋</button>'
      +'</div>'
      +'<div class="rv-amt">$'+amt+'</div>'
      +'<button class="rv-del" data-name="'+n+'" aria-label="刪除">🗑️</button>'
    +'</div>';
  }).join('');
  document.getElementById('rvTotal').textContent='$'+total;
}


document.getElementById('rvList').addEventListener('click', function(e){
  const b=e.target.closest('button'); if(!b) return;
  const n=b.dataset.name; if(!n) return;
  if(b.classList.contains('inc'))      qtyMap[n]=(qtyMap[n]||0)+1;
  else if(b.classList.contains('dec')){ const v=(qtyMap[n]||0)-1; if(v<=0) delete qtyMap[n]; else qtyMap[n]=v; }
  else if(b.classList.contains('rv-del')) delete qtyMap[n];
  renderReview(); updateCart(); render();   
});

function closeReview(){ document.getElementById('review').classList.remove('show'); }
function reviewBg(e){ if(e.target===document.getElementById('review')) closeReview(); }


function confirmSubmit(){
  const name=document.getElementById('nm').value.trim();
  // 以購物車 qtyMap 為唯一來源：品項管理若有同名兩列，用 all 迴圈會把同一項送兩次
  // （後端是相加，數量與金額會直接翻倍）。這樣「確認頁看到什麼＝送出什麼」。
  const items=Object.keys(qtyMap).filter(n=>qtyMap[n]>0).map(n=>({name:n, qty:qtyMap[n]}));
  if(!items.length){alert('請至少選購一項商品');return;}
  const btn=document.getElementById('rvSubmit');
  btn.disabled=true;btn.textContent='送出中…';
  apiPost({action:'order', name, items})
    .then(r=>{
      btn.disabled=false;btn.textContent='✅ 確認送出';
      if(r && r.success){ closeReview(); showThanks(); }
      else alert('送出失敗：'+((r && r.error) || '請再試一次'));
    })
    .catch(e=>{btn.disabled=false;btn.textContent='✅ 確認送出';alert('錯誤：連線失敗，請確認網路後再送出一次');});
}

function showThanks(){
  document.getElementById('ov').classList.add('show');
}

function bgClose(e){if(e.target===document.getElementById('ov'))forceClose();}
function forceClose(){
  document.getElementById('ov').classList.remove('show');
  Object.keys(qtyMap).forEach(k=>delete qtyMap[k]);
  document.getElementById('nm').value='';
  clearSearch(true);
  curCat='';            
  buildTabs();
  render();
}

// ===== 楓葉堆積：每片楓葉飄完一趟，就落一片在「送出訂單」按鈕上；堆滿或過一陣子整堆淡出重來 =====
(function(){
  const wrap=document.querySelector('.sub-wrap'); if(!wrap) return;
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const pile=document.createElement('div'); pile.className='pile'; wrap.insertBefore(pile, wrap.firstChild);
  const leafSvg=document.querySelector('.leaf svg'); if(!leafSvg) return;
  const fills=['url(#lf1)','url(#lf2)','url(#lf3)'];
  const MAX=14, LIFE=45000; let n=0, timer=null;
  function clear(){ pile.classList.add('fade'); setTimeout(()=>{ pile.innerHTML=''; n=0; pile.classList.remove('fade'); }, 1700); timer=null; }
  function drop(){
    if(pile.classList.contains('fade')) return;
    const el=document.createElement('div'); el.className='pl';
    const w=pile.clientWidth||300;
    const x=Math.random()*(w-24), lift=Math.min(8, Math.floor(n/3)*2), r=(Math.random()*50-25)+(Math.random()<.5?0:180);
    el.style.left=x+'px'; el.style.bottom='46px'; el.style.transform='rotate('+r+'deg) scale(.9)';
    const s=leafSvg.cloneNode(true); s.querySelector('path').setAttribute('fill', fills[n%3]); el.appendChild(s);
    pile.appendChild(el);
    requestAnimationFrame(()=>{ el.style.bottom=(-2+lift)+'px'; });   // 從上方輕輕落到地面
    n++;
    if(!timer) timer=setTimeout(clear, LIFE);
    if(n>=MAX) clear();
  }
  document.querySelectorAll('.leaf').forEach(l=>l.addEventListener('animationiteration', drop));
})();

// ===== 風一來，畫面上的楓葉／雪花停住下落、順著風往右被送走；送出畫面後重新從上面飄 =====
(function(){
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const winds=document.querySelectorAll('.wind'); if(!winds.length) return;
  function restart(el){ el.style.animation='none'; void el.offsetWidth; el.style.animation=''; }
  function gust(){
    const vw=window.innerWidth||375, vh=window.innerHeight||700;
    document.querySelectorAll('.leaf, .flake').forEach(el=>{
      if(el.classList.contains('hold')) return;
      const r=el.getBoundingClientRect(); if(r.height===0) return;
      if(r.top < -40 || r.top > vh) return;                       // 只捲看得到的
      const span=el.querySelector('span'); if(!span) return;
      const wait = Math.max(0, r.left/vw)*1400 + 250;             // 風由左往右，左邊的先被捲到
      setTimeout(()=>{
        el.classList.add('hold'); span.classList.add('swept');
        setTimeout(()=>{ span.classList.remove('swept'); el.classList.remove('hold'); restart(el); }, 2900);
      }, wait);
    });
  }
  const w0=winds[0];
  w0.addEventListener('animationstart', gust); w0.addEventListener('animationiteration', gust);
})();
</script>
